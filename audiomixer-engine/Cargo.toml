[package]
name = "audiomixer-engine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
libc = "0.2"
mxl = { path = "../../mxl/rust/mxl" }

uuid = { version = "1.17", features = ["v5"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
tower-http = { version = "0.7.1", features = ["cors"] }
quick-xml = "0.36"
# WS client only, for src/bin/audio-path-check.rs (SESSION-2026-09-16-AUDIO-PATH-CHECK-DESIGN.md)
# -- the main app is a WS *server* (axum) and never previously needed a client of its own.
tokio-tungstenite = "0.24"
clap = { version = "4", features = ["derive"] }
