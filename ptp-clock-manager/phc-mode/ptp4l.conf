# ptp4l for the RAVENNA driver's external PTP mode (see ../PHC_MODE.md): slave only, hardware
# timestamps, disciplines only the NIC's own clock (/dev/ptpN). No system clock is touched.
# Set domainNumber to the daemon's ptp_domain and the interface to its interface_name.
[global]
domainNumber            127
slaveOnly               1
# The Luminex grandmaster announces priority1 255: be at least as low, or the best-master
# comparison ranks this slave-only clock above it and ptp4l refuses to follow.
priority1               255
clockClass              255
time_stamping           hardware
network_transport       UDPv4
delay_mechanism         E2E
tx_timestamp_timeout    10
summary_interval        0
logging_level           6

[enp4s0]
